name: traderpro_7c2a_storage_spike
description: Isolated Task 7C2A encrypted Drift and secure-store spike; not production code.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: 2.34.3
  flutter:
    sdk: flutter
  flutter_secure_storage: 10.3.1
  path: 1.9.1
  path_provider: 2.1.6
  sqlite3: 3.5.0

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.5
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  yaml: 3.1.3

hooks:
  user_defines:
    sqlite3:
      # Retained after ADR-0011 selection; production Flutter remains unchanged.
      source: sqlite3mc

flutter:
  uses-material-design: true
